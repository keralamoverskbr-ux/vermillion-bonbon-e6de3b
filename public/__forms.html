<!-- Static skeleton so Netlify Forms detects the quote form at build time. -->
<html>
  <body>
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input name="move-type" />
      <input name="name" />
      <input name="phone" />
      <input name="from" />
      <input name="to" />
      <input name="size" />
      <input name="date" />
      <input name="email" />
      <input name="extras" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
